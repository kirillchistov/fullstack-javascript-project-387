# Вызов агента OpenCode из комментариев в issue и PR: /oc или /opencode
# Документация: https://opencode.ai/docs/github/
# Модель — через OpenCode Zen (https://opencode.ai/docs/zen/):
#   big-pickle — бесплатная; для платных моделей (например,
#   opencode/claude-sonnet-4-5) добавьте секрет OPENCODE_API_KEY
#   в Settings → Secrets and variables → Actions.
# Требуется установленный GitHub App: https://github.com/apps/opencode-agent
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
