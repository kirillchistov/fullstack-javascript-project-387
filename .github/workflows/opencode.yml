# Вызов агента OpenCode из комментариев в issue и PR: /oc или /opencode
# Документация: https://opencode.ai/docs/github/
# Требуется:
#   1) установленный GitHub App: https://github.com/apps/opencode-agent
#   2) секрет ANTHROPIC_API_KEY в Settings → Secrets and variables → Actions
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-20250514
