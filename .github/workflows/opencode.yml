# Интерактивный вызов агента OpenCode из комментариев: /oc или /opencode
# Документация: https://opencode.ai/docs/github/
# Требуется GitHub App: https://github.com/apps/opencode-agent
# (токен приложения через OIDC; комментарии и PR — от имени App).
# Модель — OpenCode Zen; для платных моделей добавьте OPENCODE_API_KEY
# в Settings → Secrets and variables → Actions.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Только целевые команды; игнорируем ботов (защита от самозапуска).
    if: |
      github.event.comment.user.type != 'Bot' &&
      (
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
