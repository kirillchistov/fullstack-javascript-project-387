# Ночная проверка качества демо-страницы через Lighthouse CLI.
# Запускается по расписанию (03:30 UTC = 06:30 МСК) и вручную из вкладки Actions.
# Отчёт (HTML + JSON) — артефакт; баллы — в summary; утренний issue — из JSON
# (без OpenCode: агент после разбора трогал git и ронял job на identity).
name: lighthouse-nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: https://kirillchistov.github.io/fullstack-javascript-project-387/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run Lighthouse CLI
        run: |
          mkdir -p lighthouse-report
          npx --yes lighthouse@12 "$DEMO_URL" \
            --output html --output json \
            --output-path ./lighthouse-report/report \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox"

      - name: Баллы в summary запуска
        run: |
          python3 - <<'EOF'
          import json, os
          data = json.load(open('lighthouse-report/report.report.json'))
          order = ['performance', 'accessibility', 'best-practices', 'seo']
          lines = [
              f"## Lighthouse: {data['finalDisplayedUrl']}",
              '',
              '| Категория | Балл |',
              '|---|---|',
          ]
          for key in order:
              cat = data['categories'][key]
              score = round(cat['score'] * 100)
              mark = '' if score >= 90 else ' :warning:'
              lines.append(f"| {cat['title']} | {score}{mark} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          EOF

      - name: Сохранить отчёт как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

      - name: Утренний issue с разбором
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, datetime

          data = json.load(open('lighthouse-report/report.report.json'))
          order = ['performance', 'accessibility', 'best-practices', 'seo']
          today = datetime.date.today().isoformat()
          title = f'Ночной Lighthouse-отчёт {today}'

          # Не дублируем issue, если за сегодня уже есть
          existing = subprocess.check_output(
              ['gh', 'issue', 'list', '--search', f'in:title "{title}"', '--json', 'number,title', '--limit', '5'],
              text=True,
          )
          if any(i.get('title') == title for i in json.loads(existing)):
              print(f'Issue уже есть: {title}')
              raise SystemExit(0)

          rows = []
          for key in order:
              cat = data['categories'][key]
              rows.append((cat['title'], round(cat['score'] * 100)))

          # Топ проблемных аудитов (score < 0.9), до 5 штук
          audits = data.get('audits', {})
          problems = []
          for aid, audit in audits.items():
              score = audit.get('score')
              if score is None or score >= 0.9:
                  continue
              if audit.get('scoreDisplayMode') in ('informative', 'manual', 'notApplicable'):
                  continue
              problems.append((score, audit.get('title') or aid, audit.get('description') or ''))
          problems.sort(key=lambda x: x[0])
          problems = problems[:5]

          lines = [
              f'## Баллы по категориям',
              '',
              '| Категория | Балл |',
              '|---|---|',
          ]
          for name, score in rows:
              mark = '' if score >= 90 else ' ⚠️'
              lines.append(f'| {name} | {score}{mark} |')

          lines += ['', '## Главные проблемы (score < 0.9)', '']
          if not problems:
              lines.append('Критических аудитов нет.')
          else:
              for i, (score, title_a, desc) in enumerate(problems, 1):
                  short = desc.split('.')[0] + '.' if desc else ''
                  lines.append(f'{i}. **{title_a}** (score {score}) — {short}')

          all_ok = all(s >= 90 for _, s in rows)
          lines += ['', '## Рекомендации', '']
          if all_ok:
              lines.append('Все категории ≥ 90 — правки не требуются.')
          else:
              lines += [
                  'Смотрите проблемные аудиты выше и код в `frontend/src/` / `frontend/index.html`.',
                  'Типичные направления: code-splitting бандла, контрастность текста,',
                  '`aria-label` у контролов календаря, `<meta name="description">`.',
              ]

          lines += [
              '',
              '---',
              '',
              f'Полный HTML/JSON-отчёт (артефакт): {os.environ["RUN_URL"]}',
          ]
          body = '\n'.join(lines)

          subprocess.check_call(
              ['gh', 'issue', 'create', '--title', title, '--body', body],
          )
          print(f'Создан issue: {title}')
          EOF
