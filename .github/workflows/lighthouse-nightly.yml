# Ночная проверка демо через Lighthouse + агентный разбор.
# schedule (03:30 UTC = 06:30 МСК) и ручной workflow_dispatch.
# Отчёт HTML/JSON — артефакт и summary; агент создаёт ОДИН issue
# по конкретной находке (не issue-«отчёт за день»).
# Требуется GitHub App: https://github.com/apps/opencode-agent
name: lighthouse-nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      DEMO_URL: https://kirillchistov.github.io/fullstack-javascript-project-387/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Lighthouse CLI
        run: |
          mkdir -p lighthouse-report
          npx --yes lighthouse@12 "$DEMO_URL" \
            --output html --output json \
            --output-path ./lighthouse-report/report \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox"

      - name: Баллы в summary запуска
        run: |
          python3 - <<'EOF'
          import json, os
          data = json.load(open('lighthouse-report/report.report.json'))
          order = ['performance', 'accessibility', 'best-practices', 'seo']
          lines = [
              f"## Lighthouse: {data['finalDisplayedUrl']}",
              '',
              '| Категория | Балл |',
              '|---|---|',
          ]
          for key in order:
              cat = data['categories'][key]
              score = round(cat['score'] * 100)
              mark = '' if score >= 90 else ' :warning:'
              lines.append(f"| {cat['title']} | {score}{mark} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          EOF

      - name: Сохранить отчёт как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

      # На случай, если агент всё же тронет git (не должен).
      - name: Настроить git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Агент: issue по одной находке
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            Ты обрабатываешь ночной Lighthouse-прогон демо Call Calendar
            (${{ env.DEMO_URL }}).

            JSON-отчёт: lighthouse-report/report.report.json
            HTML-отчёт лежит рядом; полный run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Задача:
            1. Прочитай категории и аудиты со score < 0.9.
            2. Выбери ОДНУ самую важную конкретную проблему для исправления
               в коде (например контраст текста, отсутствие meta description,
               aria-label у контрола, раздутый бандл).
            3. Создай ровно ОДИН GitHub issue:
               - заголовок: краткая постановка бага/улучшения на русском
                 (НЕ «Ночной Lighthouse-отчёт …»);
               - тело: что сломано, где в frontend/src или index.html править,
                 ожидаемый результат, ссылка на этот Actions run с артефактом.
            4. Если все категории ≥ 90 и критичных аудитов нет — issue не создавай,
               закончи без действий.

            Запрещено: git commit, git push, создание PR, создание issue-«отчёта»
            со сводной таблицей за день. Отчёт уже в артефакте и summary запуска.
